[package]
name = "internal-utils"
version = "0.0.0"
edition = "2024"

[dependencies]
tracing = { version = "0.1.44" }
tracing-opentelemetry = { version = "0.33.0" }
tracing-subscriber = { version =  "0.3.23", features = ["json", "env-filter"] }

# Otel
opentelemetry = { version = "0.32.0", optional = true }
opentelemetry-appender-tracing = { version =  "0.32.0", optional = true }
opentelemetry-otlp = { version = "0.32.0", optional = true }
opentelemetry-semantic-conventions = { version = "0.32.1", optional = true }
opentelemetry_sdk = { version = "0.32.1", optional = true }

# OpenAPI
utoipa = { version = "5.5", optional = true }
utoipa-axum = { version = "0.2", optional = true }

# DB
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-native-tls", "postgres", "chrono"], optional = true } 

[dev-dependencies]
axum = { version = "0.8.9" }
serde = { version = "1.0.228" }
tokio = { version = "1.52.3", features = ["full"] }
uuid = { version = "1.23.5", features = ["v4"] }

[features]
default = ["otel", "db", "openapi"]
otel = ["dep:opentelemetry", "dep:opentelemetry", "dep:opentelemetry-appender-tracing", "dep:opentelemetry-otlp", "dep:opentelemetry-semantic-conventions", "dep:opentelemetry_sdk"]
db = ["dep:sqlx"]
openapi = ["dep:utoipa", "dep:utoipa-axum"]
